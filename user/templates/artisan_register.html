{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artisan_register | CraftHover</title>
    <link rel="icon" href="{% static 'images/logo.png' %}" type="image/png">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Fontawesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

    <style>
        /* ✅ RESPONSIVE FIX */
        .form-wrapper {
            max-width: 600px;
            width: 100%;
        }

        .card {
            border-radius: 12px;
        }

        /* MOBILE */
        @media (max-width: 768px) {

            h2 {
                font-size: 20px;
            }

            h5 {
                font-size: 16px;
            }

            .container {
                padding: 10px;
            }

            .card {
                padding: 15px !important;
            }

            input, textarea {
                font-size: 14px;
            }

            /* Stack email + button */
            .row.g-2 > div {
                flex: 100%;
                max-width: 100%;
            }

            .btn {
                width: 100%;
            }
        }

        /* EXTRA SMALL */
        @media (max-width: 480px) {

            h2 {
                font-size: 18px;
            }

            .card {
                padding: 12px !important;
            }

            input, textarea {
                font-size: 13px;
            }
        }
    </style>

</head>

<body class="bg-light">

    <div class="container py-5">

        <h2 class="text-center mb-4">Artisan Register</h2>

        {% if message %}
        <div class="d-flex justify-content-center mb-3">
            <div class="alert alert-danger text-center form-wrapper">
                {{ message }}
            </div>
        </div>
        {% endif %}

        <p class="text-center">
            Already have an account?
            <a href="{% url 'artisan_login' %}" class="text-decoration-none">Login</a>
        </p>

        <form method="POST">
            {% csrf_token %}

            <!-- STEP 1 -->
            <div class="container d-flex justify-content-center mt-5">
                <div class="form-wrapper">

                    <div id="step1" class="card shadow-sm p-4" {% if show_step2 %}style="display:none;"{% endif %}>

                        <h5>Email Verification</h5>

                        <div class="row g-2">
                            <div class="col-8">
                                <input type="email" name="email" class="form-control" value="{{ email }}"
                                    placeholder="Enter Email" required>
                            </div>

                            <div class="col-4">
                                <button type="submit" name="send_otp" class="btn btn-primary w-100">
                                    Send OTP
                                </button>
                            </div>
                        </div>

                    </div>
                </div>
            </div>

    </div>

    <!-- OTP BOX -->
    <div class="container d-flex justify-content-center mt-3">
        <div class="form-wrapper">

            <div id="otpBox" class="card shadow-sm p-4 mt-3"
                {% if show_otp %}style="display:block;"{% else %}style="display:none;"{% endif %}>

                <input type="text" name="otp" class="form-control mb-2" placeholder="Enter OTP">

                <button type="submit" name="verify_otp" formnovalidate class="btn btn-success w-100">
                    Verify OTP
                </button>

            </div>

        </div>
    </div>

    </div>

    <!-- STEP 2 -->
    <div class="container d-flex justify-content-center mt-3">
        <div class="form-wrapper">

            <div class="card shadow-sm p-4"
                {% if show_step2 %}style="display:block;"{% else %}style="display:none;"{% endif %}>

                <h5 class="mb-3">Account Details</h5>

                <input type="text" name="name" class="form-control mb-2" placeholder="Name">
                <input type="text" name="phone" class="form-control mb-2" placeholder="Phone">

                <input type="email" class="form-control mb-2" value="{{ email }}" readonly>
                <input type="password" name="password" class="form-control mb-2" placeholder="Password">
                <input type="password" name="confirm_password" class="form-control mb-2" placeholder="Confirm Password">

                <h5 class="mt-3">Shop Details</h5>

                <input type="text" name="shop_name" class="form-control mb-2" placeholder="Shop Name">
                <textarea name="address" class="form-control mb-2" placeholder="Address"></textarea>

                <input type="text" name="city" class="form-control mb-2" placeholder="City">
                <input type="text" name="state" class="form-control mb-2" placeholder="State">
                <input type="number" name="pincode" class="form-control mb-2" placeholder="Pincode">

                <button type="submit" name="register" class="btn btn-success w-100">
                    Register
                </button>

            </div>

        </div>
    </div>

    </form>

    <script src="{% static 'js/artisan_register.js' %}"></script>

</body>
</html>
