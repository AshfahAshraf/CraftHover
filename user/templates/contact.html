{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | CraftHover</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

* {
    box-sizing: border-box;
}

body {
    background: #f5f5f5;
}

.container {
    position: relative;
}

/* MAIN BOX */
.main-box {
    background: linear-gradient(135deg, #a66cff, #c2b280);
    border-radius: 20px;
    overflow: hidden;
}

/* EQUAL HEIGHT */
.row.g-0 {
    display: flex;
    align-items: stretch;
}

/* LEFT FORM */
.form-section {
    padding: 50px 40px;
}

/* RIGHT PANEL */
.contact-info {
    background: white;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px;
    transform: translateX(12px); /* ✅ FIXED */
}

/* INPUT FIX */
.form-control,
.form-select,
textarea {
    width: 100%;
}

/* BUTTON */
.btn-custom {
    background-color: #544860;
    color: white;
}

.btn-custom:hover {
    background-color: #3d3347;
    color: white;
}

/* VALIDATION */
.error {
    color: red;
    font-size: 13px;
}

.valid {
    border: 2px solid #28a745 !important;
}

.invalid {
    border: 2px solid #dc3545 !important;
}

/* BACK BUTTON */
.back-btn {
    position: absolute;
    top: 20px;
    left: 20px;
    z-index: 10;
}

.back-btn .btn {
    border-radius: 20px;
    padding: 6px 14px;
}

/* MOBILE */
@media (max-width: 768px) {

    .row.g-0 {
        flex-direction: column;
    }

    .form-section {
        padding: 25px;
    }

    .contact-info {
        padding: 25px;
        text-align: center;
        border-radius: 0 0 20px 20px;
        transform: none; /* ✅ important for mobile */
    }
}

</style>
</head>

<body>

<div class="container py-5">

<!-- BACK BUTTON -->
<div class="back-btn">
    <a href="{% url 'home' %}" class="btn btn-light">
        <i class="fa fa-arrow-left"></i> Back
    </a>
</div>

<h1 class="text-center fw-bold">Report an Issue</h1>
<p class="text-center text-muted">
If something went wrong with your order, we're here to help
</p>

<div class="row justify-content-center mt-4">
<div class="col-lg-10 shadow-lg main-box">

<div class="row g-0">

<!-- LEFT -->
<div class="col-md-6 form-section">

<form method="POST" enctype="multipart/form-data" id="complaintForm">
{% csrf_token %}

<div class="mb-3">
<label>Full Name</label>
<input type="text" id="fullname" name="fullname" class="form-control">
<span class="error" id="fullnameError"></span>
</div>

<div class="mb-3">
<label>Email</label>
<input type="email" class="form-control" value="{{ request.session.email }}" readonly>
</div>

<div class="mb-3">
<label>Phone Number</label>
<input type="text" id="phone" name="phonenumber" maxlength="10" class="form-control">
<span class="error" id="phoneError"></span>
</div>

<div class="mb-3">
<label>Select Order</label>
<select id="order" name="orderid" class="form-select">
<option value="">Select Order</option>
{% for order in orders %}
<option value="{{ order.id }}">{{ order.id }}</option>
{% endfor %}
</select>
<span class="error" id="orderError"></span>
</div>

<div class="mb-3">
<label>Issue</label>
<select id="issue" name="issue_type" class="form-select">
<option value="">Select Issue</option>
<option>Damaged Product</option>
<option>Wrong Product</option>
</select>
<span class="error" id="issueError"></span>
</div>

<div class="mb-3">
<label>Upload Image</label>
<input type="file" id="image" name="product_image" class="form-control">
<span class="error" id="imageError"></span>
</div>

<div class="mb-3">
<label>Description</label>
<textarea id="description" name="description" class="form-control"></textarea>
<span class="error" id="descError"></span>
</div>

<button class="btn btn-custom w-100">Submit Complaint</button>

</form>
</div>

<!-- RIGHT -->
<div class="col-md-6 contact-info">
<div>
<h3 class="fw-bold">Contact Us</h3>
<p>We're open for suggestions</p>

<p><i class="fa fa-map-marker-alt"></i> Bangalore</p>
<p><i class="fa fa-phone"></i> 12345 67890</p>
<p><i class="fa fa-envelope"></i> support@crafthover.com</p>

<p><b>Response Time:</b> 24-48 Hours</p>
<p><b>Working Days:</b> Mon - Sat (9AM - 6PM)</p>
</div>
</div>

</div>
</div>
</div>
</div>

<!-- VALIDATION -->
<script>

function valid(el){ el.classList.add("valid"); el.classList.remove("invalid"); }
function invalid(el){ el.classList.add("invalid"); el.classList.remove("valid"); }

const name = document.getElementById("fullname");
const phone = document.getElementById("phone");
const order = document.getElementById("order");
const issue = document.getElementById("issue");
const desc = document.getElementById("description");
const image = document.getElementById("image");

document.getElementById("complaintForm").onsubmit = function(e){

let ok = true;

if(!name.value){ invalid(name); fullnameError.innerText="Required"; ok=false; }
if(!/^\d{10}$/.test(phone.value)){ invalid(phone); phoneError.innerText="10 digits"; ok=false; }
if(!order.value){ invalid(order); orderError.innerText="Select order"; ok=false; }
if(!issue.value){ invalid(issue); issueError.innerText="Select issue"; ok=false; }
if(!desc.value){ invalid(desc); descError.innerText="Required"; ok=false; }
if(!image.files.length){ invalid(image); imageError.innerText="Upload image"; ok=false; }

if(!ok){
e.preventDefault();
}

};

</script>

</body>
</html>
