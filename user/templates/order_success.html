{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Order Confirmed | CraftHover</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="{% static 'images/logo.png' %}" type="image/png">

    <style>
        body {
            background: #f9f7f3;
            font-family: sans-serif;
            margin: 0;
        }

        /* Center container */
        .wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }

        .box {
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: green;
        }

        p {
            margin: 15px 0;
            font-size: 16px;
        }

        .btn {
            display: inline-block;
            padding: 12px 30px;
            background: black;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            transition: 0.3s;
        }

        .btn:hover {
            background: #333;
        }

        /* MOBILE */
        @media (max-width: 768px) {
            h1 {
                font-size: 22px;
            }

            p {
                font-size: 14px;
            }

            .btn {
                width: 100%;
                padding: 12px;
            }
        }

        /* EXTRA SMALL */
        @media (max-width: 480px) {
            h1 {
                font-size: 20px;
            }

            p {
                font-size: 13px;
            }
        }

    </style>
</head>

<body>

<div class="wrapper">
    <div class="box">

        <h1>✅ Order Placed Successfully!</h1>

        <p>Your order has been confirmed and will be delivered soon.</p>

        <a href="{% url 'home' %}" class="btn">
            Continue Shopping
        </a>

    </div>
</div>

</body>
</html>
