{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send OTP | CraftHover</title>

    <link rel="icon" href="{% static 'images/logo.png' %}" type="image/png">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="d-flex justify-content-center align-items-center bg-light" style="min-height: 100vh;">

    <div class="container py-3 py-md-5">
        <div class="row justify-content-center">

            <!-- Responsive column -->
            <div class="col-12 col-sm-10 col-md-6 col-lg-4">

                <div class="card shadow border-0 rounded-4 p-3 p-md-4">

                    <div class="text-center mb-3">
                        <h4 class="fw-bold">Reset Password</h4>
                        <p class="text-muted small">Enter your email to receive OTP</p>
                    </div>

                    {% if error %}
                    <div class="text-center mb-2">
                        <p class="text-danger">{{ error }}</p>
                    </div>
                    {% endif %}

                    <form method="POST">
                        {% csrf_token %}

                        <div class="mb-3">
                            <input type="email"
                                   name="email"
                                   class="form-control py-2"
                                   placeholder="Enter your email"
                                   required>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary py-2">
                                Send OTP
                            </button>
                        </div>

                    </form>

                </div>

            </div>
        </div>
    </div>

</body>

</html>
