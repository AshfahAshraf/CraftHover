<!DOCTYPE html>
<html>
<head>
    <title>Admin Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">
    <div class="col-md-4 mx-auto">

        <div class="card shadow">
            <div class="card-body">

                <h3 class="text-center mb-4">Admin Register</h3>

                {% if error %}
                    <div class="alert alert-danger">{{ error }}</div>
                {% endif %}

                <!-- ================= STEP 1: EMAIL ================= -->
                {% if not otp_sent and not otp_verified %}
                <form method="POST">
                    {% csrf_token %}

                    <label>Email</label>
                    <input type="text" name="email" class="form-control mb-3" placeholder="Enter Email" required>

                    <button name="send_otp" class="btn btn-primary w-100">
                        Send OTP
                    </button>
                </form>
                {% endif %}


                <!-- ================= STEP 2: OTP ================= -->
                {% if otp_sent and not otp_verified %}
                <form method="POST">
                    {% csrf_token %}

                    <label>Enter OTP</label>
                    <input type="text" name="otp" class="form-control mb-3" placeholder="Enter OTP" required>

                    <button name="verify_otp" class="btn btn-success w-100">
                        Verify OTP
                    </button>
                </form>
                {% endif %}


                <!-- ================= STEP 3: REGISTER ================= -->
                {% if otp_verified %}
                <form method="POST">
                    {% csrf_token %}

                    <label>Username</label>
                    <input type="text" name="username" class="form-control mb-3" placeholder="Enter Username" required>

                    <label>Password</label>
                    <input type="password" name="password" class="form-control mb-3" placeholder="Enter Password" required>

                    <label>Confirm Password</label>
                    <input type="password" name="confirm_password" class="form-control mb-3" placeholder="Confirm Password" required>

                    <button name="register" class="btn btn-success w-100">
                        Register
                    </button>
                </form>
                {% endif %}

                <!-- LOGIN LINK -->
                <p class="text-center mt-3">
                    Already have an account?
                    <a href="{% url 'login_admin' %}">Login</a>
                </p>

            </div>
        </div>

    </div>
</div>

</body>
</html>
