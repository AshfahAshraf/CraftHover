{% extends 'admin_base.html' %}

{% block title %}Edit Artisan{% endblock %}

{% block header %}Edit Artisan{% endblock %}

{% block content %}

<div class="container-fluid">
    <div class="col-md-6 mx-auto">

        <div class="card shadow">
            <div class="card-body">

                <h4 class="text-center mb-3">Edit Artisan</h4>

                <form method="POST">
                    {% csrf_token %}

                    <div class="mb-2">
                        <label>Name</label>
                        <input type="text" name="name" class="form-control" value="{{ artisan.name }}">
                    </div>

                    <div class="mb-2">
                        <label>Email</label>
                        <input type="email" name="email" class="form-control" value="{{ artisan.email }}">
                    </div>

                    <div class="mb-2">
                        <label>New Password</label>
                        <input type="password" name="password" class="form-control" placeholder="Enter new password">
                    </div>

                    <div class="mb-2">
                        <label>Phone</label>
                        <input type="text" name="phone" class="form-control" value="{{ artisan.phone }}">
                    </div>

                    <div class="mb-2">
                        <label>Shop Name</label>
                        <input type="text" name="shop_name" class="form-control" value="{{ artisan.shop_name }}">
                    </div>

                    <div class="mb-2">
                        <label>Address</label>
                        <textarea name="address" class="form-control">{{ artisan.address }}</textarea>
                    </div>

                    <div class="row">
                        <div class="col-md-4 mb-2">
                            <label>City</label>
                            <input type="text" name="city" class="form-control" value="{{ artisan.city }}">
                        </div>

                        <div class="col-md-4 mb-2">
                            <label>State</label>
                            <input type="text" name="state" class="form-control" value="{{ artisan.state }}">
                        </div>

                        <div class="col-md-4 mb-2">
                            <label>Pincode</label>
                            <input type="text" name="pincode" class="form-control" value="{{ artisan.pincode }}">
                        </div>
                    </div>

                    <button class="btn btn-success w-100 mt-3">Update</button>
                </form>

                <a href="{% url 'admin_artisans' %}" class="btn btn-secondary w-100 mt-2">
                    Back
                </a>

            </div>
        </div>

    </div>
</div>

{% endblock %}
