{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin | CraftHover{% endblock %}</title>

    <link rel="icon" href="{% static 'images/logo.png' %}" type="image/png">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f5f6fa;
        }

        .sidebar {
            min-height: 100vh;
            background: #343a40;
            color: white;
        }

        .sidebar a {
            color: white;
            text-decoration: none;
            display: block;
            padding: 12px;
        }

        .sidebar a:hover {
            background: #495057;
        }

        .card {
            border: none;
            border-radius: 10px;
        }

        .topbar {
            background: white;
            padding: 12px 20px;
            border-bottom: 1px solid #ddd;
        }

        /* Mobile */
        @media (max-width: 768px) {
            .sidebar {
                min-height: auto;
            }
        }
    </style>
</head>

<body>

<div class="container-fluid">
    <div class="row">

        <!-- Sidebar -->
        <div class="col-md-2 col-12 sidebar">

            <h4 class="p-3">Admin</h4>

            <a href="{% url 'admin_dashboard' %}">Dashboard</a>
            <a href="{% url 'add_category' %}">Categories</a>
            <a href="{% url 'admin_products' %}">Products</a>
            <a href="{% url 'admin_users' %}">Users</a>
            <a href="{% url 'admin_artisans' %}">Artisans</a>

            <div class="p-3">
                <a href="{% url 'logout_admin' %}" class="btn btn-primary w-100">
                    Logout
                </a>
            </div>

        </div>

        <!-- Main Content -->
        <div class="col-md-10 col-12 p-0">

            <!-- Topbar -->
            <div class="topbar d-flex justify-content-between align-items-center">
                <h5 class="mb-0">{% block header %}Dashboard{% endblock %}</h5>
            </div>

            <!-- Page Content -->
            <div class="p-4">
                {% block content %}
                {% endblock %}
            </div>

        </div>

    </div>
</div>

</body>
</html>
